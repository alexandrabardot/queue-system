<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: #1e293b;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #2563eb;
    }
    .header h1 {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: white;
    }
    .clock {
      font-size: 28px;
      font-weight: bold;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }

    /* Main content */
    .main {
      flex: 1;
      display: flex;
      gap: 0;
    }

    /* Now serving - large left panel */
    .serving-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border-right: 2px solid #1e293b;
      padding: 40px;
    }
    .serving-label {
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .serving-number {
      font-size: 200px;
      font-weight: bold;
      color: #2563eb;
      line-height: 1;
      transition: all 0.3s ease;
    }
    .serving-number.flash {
      color: #22c55e;
      transform: scale(1.05);
    }
    .serving-sub {
      font-size: 24px;
      color: #475569;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Right panel */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f172a;
    }

    /* Waiting count */
    .waiting-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #1e293b;
      padding: 30px;
    }
    .waiting-label {
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #64748b;
      margin-bottom: 12px;
    }
    .waiting-number {
      font-size: 100px;
      font-weight: bold;
      color: #f59e0b;
      line-height: 1;
    }
    .waiting-sub {
      font-size: 16px;
      color: #475569;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Recent history */
    .history-panel {
      flex: 2;
      padding: 24px;
      overflow: hidden;
    }
    .history-label {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #64748b;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 16px;
    }
    .history-item .hnum { color: #e2e8f0; font-weight: bold; }
    .history-item .htime { color: #64748b; font-size: 14px; }

    /* Footer */
    .footer {
      background: #1e293b;
      padding: 12px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #334155;
    }
    .footer .status {
      font-size: 14px;
      color: #475569;
    }
    .footer .status span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      vertical-align: middle;
    }
    .footer .url {
      font-size: 14px;
      color: #475569;
    }

    /* Closed overlay */
    .closed-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }
    .closed-overlay.show {
      display: flex;
    }
    .closed-text {
      font-size: 48px;
      font-weight: bold;
      color: #ef4444;
      text-transform: uppercase;
      letter-spacing: 4px;
    }
    .closed-sub {
      font-size: 24px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Queue Display</h1>
    <div class="clock" id="clock">00:00:00</div>
  </div>

  <div class="main">
    <!-- Now Serving -->
    <div class="serving-panel">
      <div class="serving-label">Now Serving</div>
      <div class="serving-number" id="serving">---</div>
      <div class="serving-sub">Please proceed to the counter</div>
    </div>

    <!-- Right: Waiting + History -->
    <div class="right-panel">
      <div class="waiting-panel">
        <div class="waiting-label">Waiting</div>
        <div class="waiting-number" id="waiting">--</div>
        <div class="waiting-sub">in queue</div>
      </div>
      <div class="history-panel">
        <div class="history-label">Recently Served</div>
        <div class="history-list" id="history-list"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="status"><span></span>Live Display</div>
    <div class="url">queue-system-s1iz.onrender.com</div>
  </div>

  <!-- Closed overlay -->
  <div class="closed-overlay" id="closed-overlay">
    <div class="closed-text">Queue Closed</div>
    <div class="closed-sub">Please check back later</div>
  </div>

  <script>
    const BASE_URL = '';
    let prevServing = '---';

    // ── Clock ───────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m + ':' + s;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── Flash animation when number changes ─────────────────
    function flashNumber() {
      const el = document.getElementById('serving');
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1000);
    }

    // ── Fetch serving number ────────────────────────────────
    function checkServing() {
      fetch(BASE_URL + '/current_api.php')
        .then(r => r.text())
        .then(num => {
          const serving = num.trim();
          if (serving !== prevServing) {
            document.getElementById('serving').textContent = serving;
            if (serving !== '---') flashNumber();
            prevServing = serving;
          }
        })
        .catch(() => {});
    }

    // ── Fetch waiting count ─────────────────────────────────
    function checkWaiting() {
      fetch(BASE_URL + '/waiting_api.php')
        .then(r => r.text())
        .then(count => {
          document.getElementById('waiting').textContent = count.trim();
        })
        .catch(() => {});
    }

    // ── Fetch recent history ────────────────────────────────
    function checkHistory() {
      fetch(BASE_URL + '/history_api.php')
        .then(r => r.json())
        .then(data => {
          const list = document.getElementById('history-list');
          list.innerHTML = '';
          const recent = data.slice(0, 5);
          if (recent.length === 0) {
            list.innerHTML = '<div style="color:#475569;font-size:14px">No entries yet</div>';
            return;
          }
          recent.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            const time = new Date(item.served_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            div.innerHTML = '<span class="hnum">' + item.queue_number + '</span><span class="htime">' + time + '</span>';
            list.appendChild(div);
          });
        })
        .catch(() => {});
    }

    // ── Check if queue is closed ────────────────────────────
    function checkClosed() {
      fetch(BASE_URL + '/check_reset_api.php')
        .then(r => r.text())
        .then(status => {
          const overlay = document.getElementById('closed-overlay');
          if (status.trim() === 'AUTO_RESET' || status.trim() === 'CLOSED') {
            overlay.classList.add('show');
          } else {
            overlay.classList.remove('show');
          }
        })
        .catch(() => {});
    }

    // ── Poll everything ─────────────────────────────────────
    checkServing();
    checkWaiting();
    checkHistory();
    checkClosed();

    setInterval(checkServing, 2000);
    setInterval(checkWaiting, 3000);
    setInterval(checkHistory, 5000);
    setInterval(checkClosed, 10000);
  </script>

</body>
</html>
